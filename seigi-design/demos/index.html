<!DOCTYPE html>
<html lang="ja" data-theme="seigi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>せいぎデザイン</title>
    <link rel="stylesheet" href="../css/tokens.css" />
  </head>
  <body>
    <main class="sg-shell">
      <div class="sg-brand-row">
        <img src="../assets/mark/seigi-mark.svg" alt="せいぎデザイン マーク" />
        <div>
          <p class="sg-kicker">大成工業株式会社 · 生産技術室</p>
          <h1 class="sg-title">せいぎデザイン</h1>
        </div>
      </div>
      <p class="sg-lead">
        やわらかく親しみやすい資料を、意識せず揃えられるための部署デザインシステムです。
        大成ブルーとノーリツレッドをアクセントに、ジグDRから日常帳票までテンプレ化しています。
      </p>
      <section class="sg-card">
        <h2>カラー</h2>
        <p>
          <span class="sg-swatch" style="background:#00315E"></span> 大成ブルー
          <span class="sg-swatch" style="background:#3477B6"></span> 明青
          <span class="sg-swatch" style="background:#E8380D"></span> ノーリツレッド
          <span class="sg-swatch" style="background:#E8F3FB"></span> やわらか空
        </p>
      </section>
      <section class="sg-card">
        <h2>成果物</h2>
        <p>PowerPoint / Excel テンプレートは <code>ppt/templates</code> と <code>excel/templates</code>、配布ZIPは <code>dist/</code> にあります。</p>
        <p>
          <a class="sg-btn" href="../dist/">dist を開く</a>
          <a class="sg-btn sg-btn-accent" href="../README_USERS.md">使い方</a>
        </p>
      </section>
    </main>
  </body>
</html>
